[project]
name = "projet-dev-avance"
version = "0.1.0"
description = ""
authors = [
    {name = "Alexis Calbano",email = "a.calbano@mysecondbrain.fr"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pymysql (>=1.2.3,<2.0.0)",
    "pydocstyle (>=6.3.0,<7.0.0)",
    "sphinx (>=9.1.0,<10.0.0)",
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "cryptography (>=50.0.2,<51.0.0)",
]

[tool.poetry]
packages = [{include = "projet_dev_avance", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "pylint (>=4.1.3,<5.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "types-pymysql (>=1.2.0.20260923,<2.0.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.7,<10.0.0)",
    "mkdocstrings[python] (>=1.0.7,<2.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["src/projet_dev_avance/voitures/tests"]

[tool.coverage.report]
# lignes qui ne peuvent pas etre executees par un test
exclude_also = [
    "@abstractmethod",
    "if __name__ == .__main__.:",
]
